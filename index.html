<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beni Seviyor Musun?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Arka plandaki uçuşan kalpler */
        .bg-heart {
            position: absolute;
            color: rgba(255, 75, 110, 0.4);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ana Kart Tasarımı */
        .card {
            background: white;
            padding: 35px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
            max-width: 90%;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* Kaliteli Parlama Efekti */
        .title {
            font-family: 'Caveat', cursive;
            font-size: 44px;
            color: #ff2a54;
            margin: 0 0 5px 0;
            animation: premiumGlow 2s ease-in-out infinite alternate;
        }

        @keyframes premiumGlow {
            0% {
                text-shadow: 0 0 5px rgba(255, 105, 180, 0.5), 0 0 10px rgba(255, 105, 180, 0.3);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 20px rgba(255, 105, 180, 0.5);
                transform: scale(1.02);
            }
        }

        .question {
            font-size: 22px;
            color: #4a4a4a;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-yes {
            background-color: #ff4b6e;
            color: white;
        }

        .btn-yes:hover {
            background-color: #ff2a54;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #f0f0f0;
            color: #666;
        }

        .btn-no:hover {
            background-color: #e0e0e0;
        }

        /* Çiçek Resmi Alanı */
        .flower-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1 class="title">Diclemm</h1>
        <p class="question" id="textQuestion">Beni seviyor musun?</p>
        
        <div class="btn-container" id="btnContainer">
            <button class="btn-yes" onclick="selectYes()">Evet ❤️</button>
            <button class="btn-no" onclick="selectNo()">Hayır</button>
        </div>
    </div>

    <script>
        // Arka plandaki kalpleri oluşturan fonksiyon
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);

        // Evet butonuna basınca ne olacak?
        function selectYes() {
            document.getElementById('textQuestion').innerHTML = "Ben de seni çok seviyorum! 🌷";
            
            // Senin videondaki çiçek resmini ve kilitli evet butonunu buraya yerleştiriyoruz
            document.getElementById('btnContainer').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                    <img class="flower-img" src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?q=80&w=500" alt="Çiçek">
                    <button class="btn-yes" style="cursor: default; width: 80%; pointer-events: none;">Evet ❤️</button>
                </div>
            `;
        }

        // Hayır butonuna basınca ne olacak? (Burada butonlar tamamen kayboluyor!)
        function selectNo() {
            document.getElementById('textQuestion').innerHTML = "Üzdün... 💔";
            // Buton konteynerını tamamen temizliyoruz, böylece geri basma şansı kalmıyor!
            document.getElementById('btnContainer').innerHTML = "";
        }
    </script>

</body>
</html>
