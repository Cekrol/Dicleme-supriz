<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;600&family=Share+Tech+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(15, 12, 41, 0.6), rgba(48, 43, 99, 0.6), rgba(36, 36, 62, 0.6)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=100&w=3840') no-repeat center center/cover;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Yazılı Kalp Efekti */
        .text-heart-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.65);
            z-index: 9999;
            pointer-events: none;
            display: none;
        }

        #text-heart-container {
            position: relative;
            width: 600px;
            height: 600px;
            transform-style: preserve-3d;
        }

        .love-text {
            position: absolute;
            color: #ff5e99;
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff5e99, 0 0 20px #ff5e99;
            pointer-events: none;
            animation: text-heart-anim 2.5s infinite linear;
            opacity: 0;
        }

        @keyframes text-heart-anim {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
        }

        /* Uçuşan Kalpler */
        .bg-heart {
            position: absolute;
            color: rgba(255, 75, 110, 0.5);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 2;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* Kutu Tasarımı - İSTEDİĞİN GİBİ ŞIK BORDO VE BİRAZ DAHA KÜÇÜK */
        .card {
            background: rgba(64, 0, 26, 0.85); /* Kaliteli Bordo */
            backdrop-filter: blur(10px); 
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
            max-width: 80%;
            z-index: 10;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.8;
            animation: cardStarFlash 2s infinite alternate;
        }

        @keyframes cardStarFlash {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Başlık - PARLAYAN BEYAZ HALİ */
        .title {
            font-family: 'Caveat', cursive;
            font-size: 38px;
            color: #FFFFFF; /* Parlayan Beyaz */
            margin: 0 0 10px 0;
            animation: whitePremiumGlow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 12;
        }

        @keyframes whitePremiumGlow {
            0% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.6), 0 0 10px rgba(255, 255, 255, 0.4); transform: scale(1); }
            100% { text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px rgba(255, 255, 255, 0.7); transform: scale(1.02); }
        }

        /* Kedi Alanı */
        .cat-container {
            margin: 10px 0;
            display: inline-block;
            position: relative;
            z-index: 11;
        }
        
        .cat-gif {
            width: 120px;
            border-radius: 10px;
            position: relative;
        }

        .question {
            font-size: 19px;
            color: #fff;
            margin: 15px 0 25px 0;
            font-weight: 600;
            line-height: 1.3;
            position: relative;
            z-index: 11;
        }

        /* Butonlar */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 11;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4b6e, #ff2a54);
            color: white;
            box-shadow: 0 3px 10px rgba(255, 42, 84, 0.3);
        }

        .btn-yes:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 42, 84, 0.4);
        }

        .btn-no {
            background-color: #f0f0f0;
            color: #444;
        }

        /* Geri Sayım */
        .thought-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 400;
            margin-top: 20px;
            margin-bottom: 10px;
            position: relative;
            z-index: 11;
        }

        .timer-container {
            position: relative;
            z-index: 11;
            margin-bottom: 15px;
        }

        .timer-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1.5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            display: inline-block;
        }

        /* Evet Sonrası Yapı (Siyah Arka Planlı Lale Kutusu) */
        .flower-box {
            background: #000000;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            animation: fadeIn 1.2s ease forwards;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower-frame {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .romantic-text {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: #fff;
            line-height: 1.4;
            margin: 15px 0 25px 0;
            opacity: 0;
            animation: fadeIn 1.8s ease forwards 0.6s; 
        }

        .final-badge {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 30px;
            border-radius: 40px;
            display: inline-block;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            animation: fadeIn 1.8s ease forwards 1.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="text-heart-box">
        <div id="text-heart-container"></div>
    </div>

    <div class="card" id="mainCard">
        <script>
            function createCardStar() {
                const card = document.getElementById('mainCard');
                const star = document.createElement('div');
                star.classList.add('card-star');
                const size = Math.random() * 4 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                card.appendChild(star);
            }
            for (let i = 0; i < 40; i++) {
                createCardStar();
            }
        </script>

        <h1 class="title">Kalbimin kraliçesi ❤️‍🔥</h1>
        
        <div class="cat-container" id="catMedia">
            <img src="IMG_20260525_204108.jpg" class="cat-gif" alt="İki Tatlı Kedi">
        </div>
        
        <p class="question" id="textQuestion">Beni seviyor musun?</p>
        
        <div class="btn-container" id="btnContainer">
            <button class="btn-yes" onclick="selectYes()">Evet ❤️‍🔥🔥</button>
            <button class="btn-no" onclick="selectNo()">Hayır❌</button>
        </div>

        <p class="thought-text" id="thoughtText" style="display: none;">Düşünmek için son şansın...</p>
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div id="timerDisplay" class="timer-display">00:00:05:000</div>
        </div>

        <div id="finalContainer" style="display: none; flex-direction: column; align-items: center; width: 100%; position: relative; z-index: 12;">
            <h2 style="font-family: 'Caveat', cursive; color: #fff; font-size: 34px; margin: 0;">daha iyileri icin söz veriyorum 🙃...</h2>
            
            <div class="flower-box" style="width: 90%;">
                <img class="flower-frame" src="https://images.unsplash.com/photo-1520763185298-1b434c919102?q=80&w=1080" alt="Pembe Lale">
            </div>
            
            <p class="romantic-text">
                "𝖌𝖊𝖈𝖊 𝖌𝖔𝖐𝖞𝖚𝖟𝖚 𝖞ı𝖑𝖉ı𝖟𝖑𝖆𝖗𝖑𝖆 𝖉𝖔𝖑𝖆𝖗 𝖆𝖒𝖆 𝖇𝖊𝖓 𝖇𝖎𝖗𝖙𝖆𝖓𝖊 𝖌𝖔𝖗𝖚𝖞𝖔𝖗𝖚𝖒"
            </p>
            
            <div class="final-badge">Sonsuza kadar❤️‍🔥</div>
        </div>

    </div>

    <script>
        const textContainer = document.getElementById('text-heart-container');
        const textContentStr = "Diclem❤️‍🔥🤍";
        const totalTexts = 100;

        function createTextHeart() {
            for (let i = 0; i < totalTexts; i++) {
                const span = document.createElement('span');
                span.className = 'love-text';
                span.innerText = textContentStr;

                const t = (i / totalTexts) * 2 * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                const multiplier = 16; 
                const left = 300 + x * multiplier;
                const top = 300 + y * multiplier;

                span.style.left = `${left}px`;
                span.style.top = `${top}px`;

                const delay = Math.random() * 2.5;
                span.style.animationDelay = `${delay}s`;

                textContainer.appendChild(span);
            }
        }
        createTextHeart();

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '🌷🪷';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);

        function selectYes() {
            document.getElementById('catMedia').style.display = 'none';
            document.getElementById('textQuestion').style.display = 'none';
            document.getElementById('btnContainer').style.display = 'none';
            document.getElementById('thoughtText').style.display = 'none';
            document.getElementById('timerContainer').style.display = 'none';
            
            document.getElementById('finalContainer').style.display = 'flex';
            document.querySelector('.text-heart-box').style.display = 'block';
        }

        function selectNo() {
            document.getElementById('catMedia').style.display = 'none';
            document.getElementById('btnContainer').style.display = 'none';
            
            document.getElementById('textQuestion').innerHTML = "Düşünmek için son şansın...";
            document.getElementById('thoughtText').style.display = 'block';
            document.getElementById('timerContainer').style.display = 'block';
            
            let startTime = Date.now();
            let endTime = startTime + 5000;

            let timerInterval = setInterval(() => {
                let now = Date.now();
                let remaining = endTime - now;
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').innerHTML = "00:00:00:000";
                    document.getElementById('thoughtText').innerHTML = "Süren doldu! Artık mecburen Evet diyeceksin 🫠";
                    
                    setTimeout(() => {
                        document.getElementById('btnContainer').innerHTML = `<button class="btn-yes" onclick="selectYes()" style="width: 100%; animation: whitePremiumGlow 2s infinite alternate;">Evet ❤️‍🔥🔥</button>`;
                        document.getElementById('btnContainer').style.display = 'flex';
                    }, 1000);
                } else {
                    let hours = Math.floor(remaining / 3600000);
                    let minutes = Math.floor((remaining % 3600000) / 60000);
                    let seconds = Math.floor((remaining % 60000) / 1000);
                    let ms = remaining % 1000;
                    
                    document.getElementById('timerDisplay').innerHTML = 
                        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(ms).padStart(3, '0')}`;
                }
            }, 10);
        }
    </script>

</body>
</html>
