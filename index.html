<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;600&family=Share+Tech+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Mavi-Mor Uzay Arka Planı */
            background: linear-gradient(rgba(15, 12, 41, 0.6), rgba(48, 43, 99, 0.6), rgba(36, 36, 62, 0.6)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=100&w=3840') no-repeat center center/cover;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Uçuşan Kalpler */
        .bg-heart {
            position: absolute;
            color: rgba(255, 75, 110, 0.5);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* Kutu Tasarımı - Mor ve Şeffaf */
        .card {
            background: rgba(106, 13, 173, 0.75); /* Mor Kutu */
            backdrop-filter: blur(10px); 
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            width: 380px;
            max-width: 85%;
            z-index: 10;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Mor Kutu İçindeki Küçük Yıldızlar */
        .card-star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.8;
            animation: cardStarFlash 2s infinite alternate;
        }

        @keyframes cardStarFlash {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Başlık - Kırmızı ve Parlayan */
        .title {
            font-family: 'Caveat', cursive;
            font-size: 46px;
            color: #FF0000; /* Tam kırmızı */
            margin: 0 0 10px 0;
            animation: premiumGlow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 12;
        }

        @keyframes premiumGlow {
            0% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.4); transform: scale(1); }
            100% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.8); transform: scale(1.02); }
        }

        /* Kedi GIF Alanı */
        .cat-container {
            margin: 10px 0;
            display: inline-block;
            position: relative;
            z-index: 11;
        }
        
        .cat-gif {
            width: 130px;
            border-radius: 10px;
            position: relative;
        }

        .question {
            font-size: 21px;
            color: #fff;
            margin: 15px 0 30px 0;
            font-weight: 600;
            line-height: 1.4;
            position: relative;
            z-index: 11;
        }

        /* Butonlar */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            z-index: 11;
        }

        button {
            padding: 14px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4b6e, #ff2a54);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 42, 84, 0.3);
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 42, 84, 0.4);
        }

        .btn-no {
            background-color: #f0f0f0;
            color: #444;
        }

        /* Geri Sayım Metni */
        .thought-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 400;
            margin-top: 25px;
            margin-bottom: 12px;
            position: relative;
            z-index: 11;
        }

        /* Sayaç */
        .timer-container {
            position: relative;
            z-index: 11;
            margin-bottom: 20px;
        }

        .timer-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: inline-block;
        }

        /* Evet Tıklandığında Açılan Kısım */
        .flower-frame {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 18px;
            margin: 20px 0;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease forwards;
        }

        .romantic-text {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            color: #fff;
            line-height: 1.5;
            margin: 20px 0 30px 0;
            opacity: 0;
            animation: fadeIn 1.8s ease forwards 0.6s; 
        }

        .final-badge {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 35px;
            border-radius: 50px;
            display: inline-block;
            font-weight: 600;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            opacity: 0;
            animation: fadeIn 1.8s ease forwards 1.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <script>
            function createCardStar() {
                const card = document.getElementById('mainCard');
                const star = document.createElement('div');
                star.classList.add('card-star');
                const size = Math.random() * 4 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                card.appendChild(star);
            }
            for (let i = 0; i < 50; i++) {
                createCardStar();
            }
        </script>

        <h1 class="title">Prensesim❤️❤️‍🔥</h1>
        
        <div class="cat-container" id="catMedia">
            <img src="https://media.tenor.com/DICXvN17Z9oAAAAi/peach-cat-kiss.gif" class="cat-gif" alt="Öpücük Kedi">
        </div>
        
        <p class="question" id="textQuestion">Beni seviyor musun?</p>
        
        <div class="btn-container" id="btnContainer">
            <button class="btn-yes" onclick="selectYes()">Evet ❤️‍🔥🔥</button>
            <button class="btn-no" onclick="selectNo()">Hayır</button>
        </div>

        <p class="thought-text" id="thoughtText" style="display: none;">Düşünmek için son şansın...</p>
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div id="timerDisplay" class="timer-display">00:00:05:000</div>
        </div>

        <div id="finalContainer" style="display: none; flex-direction: column; align-items: center; width: 100%; position: relative; z-index: 12;">
            <h2 style="font-family: 'Caveat', cursive; color: #fff; font-size: 38px; margin: 0;">İyi ki varsın...</h2>
            <img class="flower-frame" src="https://images.unsplash.com/photo-1562690868-60bbe7293e94?q=100&w=1080" alt="Pembe Lale">
            
            <p class="romantic-text">
                "gece gökyüzü yıldızlarla dolar ama ben birtane görüyorum"
            </p>
            
            <div class="final-badge">Sonsuza Dek 💖</div>
        </div>

    </div>

    <script>
        // Arka Plan Kalpleri
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);

        function selectYes() {
            // Gereksiz her şeyi gizle
            document.getElementById('catMedia').style.display = 'none';
            document.getElementById('textQuestion').style.display = 'none';
            document.getElementById('btnContainer').style.display = 'none';
            document.getElementById('thoughtText').style.display = 'none';
            document.getElementById('timerContainer').style.display = 'none';
            
            // Kutlama kısmını göster (Artık üst üste binme veya çiftleşme olmayacak)
            document.getElementById('finalContainer').style.display = 'flex';
        }

        function selectNo() {
            // Kedi ve butonları gizle
            document.getElementById('catMedia').style.display = 'none';
            document.getElementById('btnContainer').style.display = 'none';
            
            // Soru yazısını değiştir
            document.getElementById('textQuestion').innerHTML = "Düşünmek için son şansın...";
            
            // Sayaç kısımlarını göster
            document.getElementById('thoughtText').style.display = 'block';
            document.getElementById('timerContainer').style.display = 'block';
            
            let startTime = Date.now();
            let endTime = startTime + 5000; // 5 Saniye

            let timerInterval = setInterval(() => {
                let now = Date.now();
                let remaining = endTime - now;
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').innerHTML = "00:00:00:000";
                    document.getElementById('thoughtText').innerHTML = "Süren doldu! Artık mecburen Evet diyeceksin 🤭";
                    
                    setTimeout(() => {
                        // Süre bitince sadece Evet butonunu göster
                        document.getElementById('btnContainer').innerHTML = `<button class="btn-yes" onclick="selectYes()" style="width: 100%; animation: premiumGlow 2s infinite alternate;">Evet ❤️‍🔥🔥</button>`;
                        document.getElementById('btnContainer').style.display = 'flex';
                    }, 1000);
                } else {
                    let hours = Math.floor(remaining / 3600000);
                    let minutes = Math.floor((remaining % 3600000) / 60000);
                    let seconds = Math.floor((remaining % 60000) / 1000);
                    let ms = remaining % 1000;
                    
                    document.getElementById('timerDisplay').innerHTML = 
                        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(ms).padStart(3, '0')}`;
                }
            }, 10);
        }
    </script>

</body>
</html>
